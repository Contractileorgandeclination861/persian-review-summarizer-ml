[project]
name = "review-summarizer"
version = "1.0.0"
description = "خلاصه‌ساز محلی و آفلاین نظرات فارسی مبتنی بر ML/DL"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
